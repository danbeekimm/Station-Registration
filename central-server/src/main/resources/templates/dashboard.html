<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dustwatch 대시보드</title>
    <style>
        :root { --bg: #f4f6f8; --card: #fff; --line: #e1e5ea; --text: #1f2933; --muted: #6b7a8a;
                --g1: #b71c1c; --g2: #d0021b; --g3: #e67e22; --g4: #f5a623; --g5: #4a90e2; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
        header { display: flex; align-items: baseline; gap: 16px; padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
        header h1 { margin: 0; font-size: 20px; }
        header .stat { color: var(--muted); font-size: 14px; }
        header .stat b { color: var(--text); }
        #live { margin-left: auto; font-size: 13px; color: var(--muted); }
        #live.on::before { content: "●"; color: #2e7d32; margin-right: 6px; }
        #live.off::before { content: "●"; color: #c62828; margin-right: 6px; }
        main { padding: 16px 24px 40px; display: grid; gap: 16px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
        .card h2 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 small { color: var(--muted); font-weight: normal; }
        .values { display: flex; gap: 18px; font-size: 14px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
        .values b { font-size: 18px; color: var(--text); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }
        .badge.none { background: #9aa5b1; }
        .badge.g1 { background: var(--g1); } .badge.g2 { background: var(--g2); } .badge.g3 { background: var(--g3); }
        .badge.g4 { background: var(--g4); } .badge.g5 { background: var(--g5); }
        .tag { display: inline-block; padding: 1px 6px; border: 1px solid #f5a623; color: #a36400; border-radius: 4px; font-size: 12px; margin-left: 4px; }
        canvas { width: 100%; height: 180px; }
        section.feed { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
        section.feed h3 { margin: 0 0 8px; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        th { color: var(--muted); font-weight: 600; }
        .feeds { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .feeds section:last-child table + table { margin-top: 14px; }
        .muted { color: var(--muted); }
        @media (max-width: 900px) { .feeds { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>dustwatch</h1>
    <span class="stat">측정소 <b th:text="${#lists.size(stations)}">0</b></span>
    <span class="stat">경보 <b id="alert-total" th:text="${alertTotal}">0</b></span>
    <span class="stat">Slack 대기 <b th:text="${pendingSlack}">0</b></span>
    <span class="stat">기준: <span th:text="${ruleSummary}"></span></span>
    <span id="live" class="off">연결 중…</span>
</header>
<main>
    <div class="cards" id="cards">
        <article class="card" th:each="s : ${stations}" th:id="${s.id}" th:attr="data-station=${s.id}">
            <h2><span th:text="${s.name}">측정소</span> <small th:text="${s.id}">코드</small>
                <span class="badge" th:classappend="${s.lastGrade == null ? 'none' : 'g' + s.lastGrade}"
                      th:text="${s.lastGrade == null ? '경보 없음' : s.lastLevel + ' ' + s.lastGrade + '등급'}">경보</span>
                <span class="tag" th:each="equipment : ${s.openMaintenance}" th:text="${equipment} + ' 점검 중'">점검</span>
            </h2>
            <div class="values">
                <span>PM10 <b data-field="pm10" th:text="${s.pm10 == null} ? '–' : ${#numbers.formatDecimal(s.pm10, 1, 0)}">–</b> ㎍/㎥</span>
                <span>PM2.5 <b data-field="pm25" th:text="${s.pm25 == null} ? '–' : ${#numbers.formatDecimal(s.pm25, 1, 0)}">–</b> ㎍/㎥</span>
                <span>측정 시각 <b data-field="at" th:text="${s.latestAt == null} ? '–' : ${#temporals.format(s.latestAt, 'MM-dd HH:mm')}">–</b></span>
                <span>경보 <b data-field="count" th:text="${s.alertCount}">0</b>건</span>
            </div>
            <canvas th:attr="data-chart=${s.id}"></canvas>
        </article>
    </div>

    <div class="feeds">
        <section class="feed">
            <h3>최근 경보</h3>
            <table>
                <thead><tr><th>발령 시각</th><th>측정소</th><th>등급</th><th>단계</th><th>농도</th><th>지속</th><th>Slack</th></tr></thead>
                <tbody id="alert-feed">
                <tr th:each="a : ${alerts}">
                    <td th:text="${#temporals.format(a.issuedAt, 'MM-dd HH:mm')}"></td>
                    <td th:text="${a.stationName + ' (' + a.stationId + ')'}"></td>
                    <td><span class="badge" th:classappend="'g' + ${a.grade}" th:text="${a.grade}"></span></td>
                    <td th:text="${a.level}"></td>
                    <td th:text="${a.pollutant + ' ' + #numbers.formatDecimal(a.triggerValue, 1, 1)}"></td>
                    <td th:text="${a.sustainedHours + '시간'}"></td>
                    <td class="muted" th:text="${a.slackStatus}"></td>
                </tr>
                </tbody>
            </table>
        </section>
        <section class="feed">
            <h3>점검 내역</h3>
            <table>
                <thead><tr><th>측정소</th><th>장비</th><th>시작</th><th>종료</th><th>시간</th></tr></thead>
                <tbody id="maintenance-feed">
                <tr th:each="m : ${maintenance}" th:attr="data-key=${m.stationId + '|' + m.equipment + '|' + m.startedAt}">
                    <td th:text="${m.stationName}"></td>
                    <td th:text="${m.equipment}"></td>
                    <td th:text="${#temporals.format(m.startedAt, 'MM-dd HH:mm')}"></td>
                    <td th:text="${m.endedAt == null} ? '진행 중' : ${#temporals.format(m.endedAt, 'MM-dd HH:mm')}"></td>
                    <td th:text="${m.hours}"></td>
                </tr>
                </tbody>
            </table>
            <h3 style="margin-top:14px">거부 누적</h3>
            <table>
                <thead><tr><th>사유</th><th>건수</th></tr></thead>
                <tbody>
                <tr th:if="${rejectCounts.isEmpty()}"><td colspan="2" class="muted">없음</td></tr>
                <tr th:each="entry : ${rejectCounts}"><td th:text="${entry.key}"></td><td th:text="${entry.value}"></td></tr>
                </tbody>
            </table>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
<script th:inline="javascript">
    const INITIAL_STATIONS = /*[(${stationsJson})]*/ [];
    const MAX_POINTS = /*[[${chartPoints}]]*/ 48;
    const charts = new Map();

    const label = (at) => at ? at.replace('T', ' ').substring(5, 16) : '';
    const fmt = (v) => (v === null || v === undefined) ? '–' : Math.round(v * 10) / 10;

    function buildChart(canvas, points) {
        const ctx = canvas.getContext('2d');
        const constant = (value) => points.map(() => value);
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: points.map(p => label(p.at)),
                datasets: [
                    { label: 'PM10', data: points.map(p => p.pm10), borderColor: '#1f77b4', backgroundColor: '#1f77b4', tension: 0.2, pointRadius: 2, spanGaps: false },
                    { label: 'PM2.5', data: points.map(p => p.pm25), borderColor: '#9467bd', backgroundColor: '#9467bd', tension: 0.2, pointRadius: 2, spanGaps: false },
                    { label: 'PM10 경보 300', data: constant(300), borderColor: '#d0021b', borderDash: [6, 4], pointRadius: 0, borderWidth: 1 },
                    { label: 'PM10 주의보 150', data: constant(150), borderColor: '#f5a623', borderDash: [6, 4], pointRadius: 0, borderWidth: 1 },
                    { label: 'PM2.5 주의보 75', data: constant(75), borderColor: '#e67e22', borderDash: [2, 4], pointRadius: 0, borderWidth: 1 }
                ]
            },
            options: { animation: false, responsive: true, maintainAspectRatio: false,
                       scales: { y: { beginAtZero: true } }, plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } } }
        });
        return chart;
    }

    function pushPoint(stationId, event) {
        const chart = charts.get(stationId);
        if (!chart) return;
        chart.data.labels.push(label(event.at));
        chart.data.datasets[0].data.push(event.pm10);
        chart.data.datasets[1].data.push(event.pm25);
        for (let i = 2; i < chart.data.datasets.length; i++) chart.data.datasets[i].data.push(chart.data.datasets[i].data[0] ?? [300, 150, 75][i - 2]);
        if (chart.data.labels.length > MAX_POINTS) chart.data.datasets.forEach(d => d.data.shift()) || chart.data.labels.shift();
        if (chart.data.labels.length > MAX_POINTS) chart.data.labels.shift();
        chart.update();
    }

    function ensureCard(stationId) {
        let card = document.getElementById(stationId);
        if (card) return card;
        // 처음 보는 측정소(기동 후 등록·접속)는 카드를 동적으로 만든다
        card = document.createElement('article');
        card.className = 'card'; card.id = stationId; card.dataset.station = stationId;
        card.innerHTML = `<h2><span>${stationId}</span> <small>${stationId}</small> <span class="badge none">경보 없음</span></h2>
            <div class="values"><span>PM10 <b data-field="pm10">–</b> ㎍/㎥</span><span>PM2.5 <b data-field="pm25">–</b> ㎍/㎥</span>
            <span>측정 시각 <b data-field="at">–</b></span><span>경보 <b data-field="count">0</b>건</span></div><canvas data-chart="${stationId}"></canvas>`;
        document.getElementById('cards').appendChild(card);
        charts.set(stationId, buildChart(card.querySelector('canvas'), []));
        return card;
    }

    function onMeasurement(event) {
        const card = ensureCard(event.stationId);
        card.querySelector('[data-field=pm10]').textContent = fmt(event.pm10);
        card.querySelector('[data-field=pm25]').textContent = fmt(event.pm25);
        card.querySelector('[data-field=at]').textContent = label(event.at);
        pushPoint(event.stationId, event);
    }

    function onAlert(event) {
        const card = ensureCard(event.stationId);
        const badge = card.querySelector('.badge');
        badge.className = 'badge g' + event.grade;
        badge.textContent = `${event.level} ${event.grade}등급`;
        const count = card.querySelector('[data-field=count]');
        count.textContent = Number(count.textContent) + 1;
        const total = document.getElementById('alert-total');
        total.textContent = Number(total.textContent) + 1;
        const name = card.querySelector('h2 span').textContent;
        const row = document.createElement('tr');
        row.innerHTML = `<td>${label(event.issuedAt)}</td><td>${name} (${event.stationId})</td><td><span class="badge g${event.grade}">${event.grade}</span></td>
            <td>${event.level}</td><td>${event.pollutant} ${fmt(event.triggerValue)}</td><td>${event.sustainedHours}시간</td><td class="muted">PENDING</td>`;
        const feed = document.getElementById('alert-feed');
        feed.prepend(row);
        while (feed.rows.length > 30) feed.deleteRow(-1);
    }

    function onMaintenance(event) {
        const card = ensureCard(event.stationId);
        const name = card.querySelector('h2 span').textContent;
        const tagText = `${event.equipment} 점검 중`;
        const existingTag = Array.from(card.querySelectorAll('.tag')).find(t => t.textContent === tagText);
        if (event.kind === 'ended') { if (existingTag) existingTag.remove(); }
        else if (!existingTag) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = tagText; card.querySelector('h2').appendChild(tag); }

        const key = `${event.stationId}|${event.equipment}|${event.startedAt}`;
        const feed = document.getElementById('maintenance-feed');
        let row = feed.querySelector(`tr[data-key="${key}"]`);
        if (!row) { row = document.createElement('tr'); row.dataset.key = key; feed.prepend(row); }
        row.innerHTML = `<td>${name}</td><td>${event.equipment}</td><td>${label(event.startedAt)}</td>
            <td>${event.endedAt ? label(event.endedAt) : '진행 중'}</td><td>${event.hours}</td>`;
        while (feed.rows.length > 20) feed.deleteRow(-1);
    }

    INITIAL_STATIONS.forEach(s => charts.set(s.id, buildChart(document.querySelector(`canvas[data-chart="${s.id}"]`), s.points)));

    const live = document.getElementById('live');
    const source = new EventSource('/stream');
    source.onopen = () => { live.className = 'on'; live.textContent = '실시간 수신 중'; };
    source.onerror = () => { live.className = 'off'; live.textContent = '재접속 중…'; };
    source.addEventListener('measurement', e => onMeasurement(JSON.parse(e.data)));
    source.addEventListener('alert', e => onAlert(JSON.parse(e.data)));
    source.addEventListener('maintenance', e => onMaintenance(JSON.parse(e.data)));

    if (location.hash) { const target = document.getElementById(location.hash.substring(1)); if (target) target.scrollIntoView(); }
</script>
</body>
</html>
