server:
  port: ${DUST_HTTP_PORT:8080}   # 대시보드(GET /)와 SSE(GET /stream)

spring:
  application:
    name: dustwatch-central-server
  thymeleaf:
    cache: false
  datasource:
    # 기본값은 docker-compose의 PostgreSQL. 호스트·포트·DB명은 각각 환경변수로 바꾸고, 전체 URL은 DUST_DB_URL로 덮어쓸 수 있다.
    url: ${DUST_DB_URL:jdbc:postgresql://${DUST_DB_HOST:localhost}:${DUST_DB_PORT:5432}/${DUST_DB_NAME:dust}}
    username: ${DUST_DB_USER:dust}
    password: ${DUST_DB_PASSWORD:dust}
    hikari:
      pool-name: dust-pool
      maximum-pool-size: 5

dust:
  tcp:
    port: ${DUST_TCP_PORT:9000}
    hello-timeout: 5s      # 접속 후 HELLO가 와야 하는 시간. 빈 연결 점유 방지
    read-timeout: 30s      # 인증 뒤 메시지 간 최대 공백. 1초 간격 전송이 30초 멈추면 비정상으로 본다
    max-line-bytes: 4096
  validation:
    max-dust-concentration: 2000   # ㎍/㎥. 국내 관측 기록을 넉넉히 넘는 상한. 센서 오작동·조작 값이 경보를 내지 못하게 함
    max-ozone-ppm: 1.0
    max-future-skew: 1d            # 측정 시각이 서버 시각 + 1일을 넘으면 거부
    max-consecutive-out-of-order: 3  # seq 불연속이 연속 3회면 접속을 끊어 측정소가 재개 지점을 다시 받게 함
  slack:
    # Incoming Webhook URL. 우선순위: 이 값 < 환경변수 SLACK_WEBHOOK_URL < 실행 인자 --dust.slack.webhook-url=...
    # 비어 있으면 전송을 건너뛰고 alert_log.slack_status를 SKIPPED로 기록한다.
    webhook-url: ${SLACK_WEBHOOK_URL:}
    connect-timeout: 3s
    read-timeout: 5s
    max-attempts: 3          # 5xx·타임아웃 재시도 횟수. 초과하면 FAILED. 429는 Retry-After만큼 미루고 횟수에 세지 않음
    send-interval: 1s        # Incoming Webhook의 초당 1건 제한을 디스패처 주기로 지킴
    dashboard-url: ${DUST_DASHBOARD_URL:http://localhost:${DUST_HTTP_PORT:8080}}   # Slack 메시지의 대시보드 링크. 비우면 링크 줄 생략

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus   # 외부 툴 없이 curl로 확인. 그 외 엔드포인트는 열지 않는다
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.exem.dust: INFO
